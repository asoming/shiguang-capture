name: Windows and macOS package candidates
on:
  push:
    branches: ['feat/**']
    paths: ['src/**', 'scripts/build*.py', 'pyproject.toml', '.github/workflows/package-candidates.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      SHIGUANG_NO_HOTKEYS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: MSYS
          path-type: inherit
          install: make nasm diffutils
      - name: Install build dependencies
        run: pip install -e ".[gui,ocr,record,dev]" pyinstaller wheel "Cython>=3.1,<4"
      - name: Restore compiled media runtime
        uses: actions/cache/restore@v4
        id: media-cache
        with:
          path: build/media-runtime
          key: media-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('scripts/build_media_runtime.py') }}
      - name: Build media runtime on macOS
        if: runner.os == 'macOS' && steps.media-cache.outputs.cache-hit != 'true'
        run: python scripts/build_media_runtime.py
      - name: Build media runtime on Windows
        if: runner.os == 'Windows' && steps.media-cache.outputs.cache-hit != 'true'
        env:
          SHIGUANG_MSYS_BASH: ${{ steps.msys2.outputs.msys2-location }}\usr\bin\bash.exe
        run: python scripts/build_media_runtime.py
      - name: Save compiled media runtime
        if: steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/media-runtime
          key: ${{ steps.media-cache.outputs.cache-primary-key }}
      - name: Install custom encoder wheel
        shell: bash
        run: pip install --force-reinstall --no-deps build/media-runtime/wheels/*.whl
      - name: Build Windows package
        if: runner.os == 'Windows'
        run: python scripts/build_exe.py
      - name: Build macOS package
        if: runner.os == 'macOS'
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/build/media-runtime/runtime/lib
        run: python scripts/build_exe.py
      - name: Test standalone Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'artifacts/package-tests' | Out-Null
          $checks = @(
            @{ Name = 'self-test'; Arguments = @('--self-test') },
            @{ Name = 'recording-self-test'; Arguments = @('--recording-self-test') },
            @{ Name = 'native-recording'; Arguments = @('--recording-desktop-test', 'artifacts/package-native') }
          )
          foreach ($check in $checks) {
            $env:SHIGUANG_SELF_TEST_LOG = Join-Path $PWD ('artifacts/package-tests/' + $check.Name + '.log')
            $process = Start-Process -FilePath 'dist/ShiguangCapture/ShiguangCapture.exe' -ArgumentList $check.Arguments -PassThru
            if (-not $process.WaitForExit(180000)) {
              $process.Kill($true)
              Get-Content $env:SHIGUANG_SELF_TEST_LOG -ErrorAction SilentlyContinue
              throw "Standalone test timed out: $($check.Name)"
            }
            Get-Content $env:SHIGUANG_SELF_TEST_LOG -ErrorAction SilentlyContinue
            if ($process.ExitCode -ne 0) { throw "Standalone test failed: $($check.Name) ($($process.ExitCode))" }
          }
          Compress-Archive -Path 'dist/ShiguangCapture' -DestinationPath 'dist/ShiguangCapture-Windows-x86_64-preview.zip'
      - name: Test standalone macOS application
        if: runner.os == 'macOS'
        run: |
          dist/ShiguangCapture.app/Contents/MacOS/ShiguangCapture --self-test
          dist/ShiguangCapture.app/Contents/MacOS/ShiguangCapture --recording-self-test
          tar -czf dist/ShiguangCapture-macOS-arm64-preview.tar.gz -C dist ShiguangCapture.app
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: package-candidate-${{ matrix.os }}
          path: |
            dist/ShiguangCapture-macOS-arm64-preview.tar.gz
            dist/ShiguangCapture-Windows-x86_64-preview.zip
            artifacts/package-tests/
            artifacts/package-native/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: package-failure-${{ matrix.os }}
          path: |
            build/media-runtime/ffmpeg-8.0.1/ffbuild/config.log
            build/pyinstaller/ShiguangCapture/warn-ShiguangCapture.txt
            artifacts/package-tests/
            artifacts/package-native/
