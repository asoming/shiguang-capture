name: Native desktop acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2025, macos-14]
    env:
      PYTHONIOENCODING: utf-8
      SHIGUANG_NO_HOTKEYS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux native desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox x11-utils libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-render-util0 libpulse0
      - name: Install capture and encoding dependencies
        id: dependencies
        run: pip install -e ".[gui,record,dev]"
      - name: Encoder, crash recovery and direct annotation tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_recording.py tests/test_inline_capture.py --junitxml=artifacts/regression.xml
      - name: Record native Linux desktop
        if: runner.os == 'Linux'
        env:
          XDG_SESSION_TYPE: x11
        run: xvfb-run -a -s '-screen 0 1280x800x24' python scripts/accept_desktop_recording.py artifacts/native-recording
      - name: Native Linux scroll capture at 1x and 2x DPI
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          QT_SCALE_FACTOR=1 xvfb-run -a -s '-screen 0 1920x1200x24' python scripts/accept_scroll_capture.py artifacts/scroll-1x
          QT_SCALE_FACTOR=2 xvfb-run -a -s '-screen 0 1920x1200x24' python scripts/accept_scroll_capture.py artifacts/scroll-2x
      - name: Record native Windows desktop
        if: runner.os == 'Windows'
        run: python scripts/accept_desktop_recording.py artifacts/native-recording
      - name: Repeat native macOS capture three times
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && runner.os == 'macOS' }}
        run: |
          python - <<'PYTEST'
          import subprocess, sys
          outcomes = []
          for attempt in range(1, 4):
              result = subprocess.run([sys.executable, 'scripts/accept_desktop_recording.py', f'artifacts/native-recording-{attempt}'])
              outcomes.append(result.returncode)
          print('macOS repeated capture exit codes:', outcomes)
          raise SystemExit(1 if any(outcomes) else 0)
          PYTEST
      - name: Native Linux recording controls
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && runner.os == 'Linux' }}
        env:
          XDG_SESSION_TYPE: x11
        run: xvfb-run -a -s '-screen 0 1280x800x24' python scripts/accept_record_controls.py artifacts/record-controls
      - name: Native Windows and macOS recording controls
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && runner.os != 'Linux' }}
        run: python scripts/accept_record_controls.py artifacts/record-controls
      - name: Record native Linux window
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && runner.os == 'Linux' }}
        env:
          XDG_SESSION_TYPE: x11
        run: xvfb-run -a -s '-screen 0 1280x800x24' sh -c 'openbox --sm-disable >artifacts/openbox.log 2>&1 & sleep 2; xprop -root _NET_SUPPORTING_WM_CHECK; python scripts/accept_desktop_recording.py artifacts/native-window --window'
      - name: Record native Windows or macOS window
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && runner.os != 'Linux' }}
        run: python scripts/accept_desktop_recording.py artifacts/native-window --window
      - name: Upload evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-desktop-${{ matrix.os }}
          path: artifacts/
          retention-days: 14
