name: Native desktop acceptance

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2025, macos-14]
    env:
      PYTHONIOENCODING: utf-8
      SHIGUANG_NO_HOTKEYS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux native desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-render-util0 libpulse0
      - name: Install capture and encoding dependencies
        run: pip install -e ".[gui,record,dev]"
      - name: Encoder, crash recovery and direct annotation tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_recording.py tests/test_inline_capture.py --junitxml=artifacts/regression.xml
      - name: Record native Linux desktop
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x800x24' python scripts/accept_desktop_recording.py artifacts/native-recording
      - name: Record native Windows or macOS desktop
        if: runner.os != 'Linux'
        run: python scripts/accept_desktop_recording.py artifacts/native-recording
      - name: Record native Linux window
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x800x24' sh -c 'openbox >/tmp/shiguang-openbox.log 2>&1 & python scripts/accept_desktop_recording.py artifacts/native-window --window'
      - name: Record native Windows or macOS window
        if: runner.os != 'Linux'
        run: python scripts/accept_desktop_recording.py artifacts/native-window --window
      - name: Upload evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-desktop-${{ matrix.os }}
          path: artifacts/
          retention-days: 14
