name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  # 纯逻辑层单测：三平台 × 两个 Python 版本，零 GUI 依赖
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (logic layer only)
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest

  # Qt 导入冒烟：验证 GUI 模块在真实 PySide6 下可加载（离屏渲染，不开窗口）
  qt-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0 fonts-dejavu-core libpulse0
      - name: Install with GUI + OCR deps
        run: pip install -e ".[gui,ocr,record,dev]"
      - name: Import GUI modules (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from shiguang_capture.app import AppController; from shiguang_capture.capture.selector import RegionSelector; from shiguang_capture.capture.scroller import ScrollCaptureSession; from shiguang_capture.ui.pin_window import PinWindow; from shiguang_capture.ui.picker import ColorPickerOverlay; from shiguang_capture.ui.settings_window import SettingsWindow; from shiguang_capture.ui.scroll_preview import ScrollPreviewWindow; from shiguang_capture.ui.result_panel import ResultPanel; from shiguang_capture.ui.busy import BusyIndicator; from shiguang_capture.hotkeys import HotkeyManager; print('qt-smoke OK')"
      - name: GUI regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          SHIGUANG_NO_HOTKEYS: "1"
        run: pytest
      - name: Real OCR worker and clipboard regression
        env:
          QT_QPA_PLATFORM: offscreen
          SHIGUANG_NO_HOTKEYS: "1"
        run: python scripts/smoke_desktop.py
      - name: Structured modes and safe exports
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m shiguang_capture --self-test
      - name: CLI self-check
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m shiguang_capture --check
      - name: OCR engine integration smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_ocr.py
      - name: Recognition + translation chain smoke
        env:
          QT_QPA_PLATFORM: offscreen
          SHIGUANG_NO_HOTKEYS: "1"
        run: python scripts/smoke_ocr_translate.py

  # Linux bundle; Windows/macOS bundles run in package-candidates.yml.
  package:
    runs-on: ubuntu-22.04
    needs: [test, qt-smoke, site-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-render-util0 fonts-dejavu-core libpulse0 xvfb nasm pkg-config build-essential
      - name: Install locked build dependencies
        run: |
          pip install -r requirements-linux.lock
          pip install -e . --no-deps
      - name: Build minimal recording runtime from source
        run: |
          python scripts/build_media_runtime.py
          pip install --no-deps build/media-runtime/wheels/*.whl
      - name: Prepare verified offline translation models
        run: python scripts/build_translation_models.py
      - name: Build executable
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/media-runtime/runtime/lib
        run: python scripts/build_exe.py
      - name: Test standalone package
        run: |
          dist/ShiguangCapture/ShiguangCapture --version
          dist/ShiguangCapture/ShiguangCapture --translation-self-test
          dist/ShiguangCapture/ShiguangCapture --self-test
          dist/ShiguangCapture/ShiguangCapture --recording-self-test
          xvfb-run -a -s '-screen 0 1280x800x24' env XDG_SESSION_TYPE=x11 dist/ShiguangCapture/ShiguangCapture --recording-desktop-test artifacts/package-native
          xvfb-run -a -s '-screen 0 1280x800x24' env XDG_SESSION_TYPE=x11 dist/ShiguangCapture/ShiguangCapture --preview-desktop-test artifacts/package-preview
      - name: Build and test Debian installer
        run: |
          python scripts/build_deb.py
          mkdir -p artifacts/installer-tests
          sudo apt-get install -y ./dist/*.deb
          test "$(cat /opt/shiguang-capture/VERSION)" = "$(cat dist/ShiguangCapture/VERSION)"
          test -f /usr/share/applications/shiguang-capture.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/shiguang-capture.png
          shiguang-capture --self-test > artifacts/installer-tests/installed-ocr.log
          shiguang-capture --translation-self-test > artifacts/installer-tests/installed-translation.log
          shiguang-capture --recording-self-test > artifacts/installer-tests/installed-recording.log
          mkdir -p "$HOME/.config/shiguang-capture"
          echo preserve-user-settings > "$HOME/.config/shiguang-capture/installer-test.txt"
          sudo apt-get install --reinstall -y ./dist/*.deb
          sudo apt-get purge -y shiguang-capture
          test ! -e /usr/bin/shiguang-capture
          test ! -e /opt/shiguang-capture/ShiguangCapture
          test ! -e /usr/share/applications/shiguang-capture.desktop
          test "$(cat "$HOME/.config/shiguang-capture/installer-test.txt")" = preserve-user-settings
          echo 'Install, launch, reinstall, uninstall and settings preservation passed.' > artifacts/installer-tests/result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ShiguangCapture-Linux-installer
          path: |
            dist/*.deb
            artifacts/installer-tests/
          retention-days: 14
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiguangCapture-Linux-x86_64
          path: dist/ShiguangCapture/
          retention-days: 14

  # 产品站静态检查：HTML 可解析 + 本地资源引用存在
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate site pages
        run: python scripts/check_site.py
