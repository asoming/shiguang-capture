name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 纯逻辑层单测：三平台 × 两个 Python 版本，零 GUI 依赖
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (logic layer only)
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest

  # Qt 导入冒烟：验证 GUI 模块在真实 PySide6 下可加载（离屏渲染，不开窗口）
  qt-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install with GUI deps
        run: pip install -e ".[all,dev]"
      - name: Import GUI modules (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from shiguang_capture.app import AppController; from shiguang_capture.capture.selector import RegionSelector; from shiguang_capture.ui.pin_window import PinWindow; from shiguang_capture.ui.picker import ColorPickerOverlay; from shiguang_capture.hotkeys import HotkeyManager; print('qt-smoke OK')"
      - name: CLI self-check
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m shiguang_capture --check

  # 产品站静态检查：HTML 可解析 + 本地资源引用存在
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate site pages
        run: python scripts/check_site.py
