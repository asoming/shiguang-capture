name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

jobs:
  # 纯逻辑层单测：三平台 × 两个 Python 版本，零 GUI 依赖
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (logic layer only)
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest

  # Qt 导入冒烟：验证 GUI 模块在真实 PySide6 下可加载（离屏渲染，不开窗口）
  qt-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0 fonts-dejavu-core
      - name: Install with GUI + OCR deps
        run: pip install -e ".[gui,ocr,record,dev]"
      - name: Import GUI modules (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from shiguang_capture.app import AppController; from shiguang_capture.capture.selector import RegionSelector; from shiguang_capture.capture.scroller import ScrollCaptureSession; from shiguang_capture.ui.pin_window import PinWindow; from shiguang_capture.ui.picker import ColorPickerOverlay; from shiguang_capture.ui.settings_window import SettingsWindow; from shiguang_capture.ui.scroll_preview import ScrollPreviewWindow; from shiguang_capture.ui.result_panel import ResultPanel; from shiguang_capture.ui.busy import BusyIndicator; from shiguang_capture.hotkeys import HotkeyManager; print('qt-smoke OK')"
      - name: GUI regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          SHIGUANG_NO_HOTKEYS: "1"
        run: pytest
      - name: Real OCR worker and clipboard regression
        env:
          QT_QPA_PLATFORM: offscreen
          SHIGUANG_NO_HOTKEYS: "1"
        run: python scripts/smoke_desktop.py
      - name: Structured modes and safe exports
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m shiguang_capture --self-test
      - name: CLI self-check
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m shiguang_capture --check
      - name: OCR engine integration smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_ocr.py
      - name: Recognition + translation chain smoke
        env:
          QT_QPA_PLATFORM: offscreen
          SHIGUANG_NO_HOTKEYS: "1"
        run: python scripts/smoke_ocr_translate.py

  # 正式包只发布 Linux；其他平台的 Qt jobs 是实验兼容性检查。
  package:
    runs-on: ubuntu-22.04
    needs: [test, qt-smoke, site-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0 fonts-dejavu-core
      - name: Install locked build dependencies
        run: |
          pip install -r requirements-linux.lock
          pip install -e . --no-deps
      - name: Build executable
        run: python scripts/build_exe.py
      - name: Test standalone package
        run: |
          dist/ShiguangCapture/ShiguangCapture --version
          dist/ShiguangCapture/ShiguangCapture --self-test
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiguangCapture-Linux-x86_64
          path: dist/ShiguangCapture/
          retention-days: 14

  # 产品站静态检查：HTML 可解析 + 本地资源引用存在
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate site pages
        run: python scripts/check_site.py
