name: Website checks

on:
  push:
    branches: [main]
    paths: ['docs/**', 'guides/**', 'README*', 'scripts/check_site.py', '.github/workflows/site.yml']
  pull_request:
    paths: ['docs/**', 'guides/**', 'README*', 'scripts/check_site.py', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_site.py
