[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiguang-capture"
version = "1.4.7"
description = "拾光 Capture — 屏幕信息捕获与再利用工具（截/钉/取/录 + 本地 OCR + 离线翻译）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "asoming" }]
keywords = ["screenshot", "ocr", "screen-capture", "pin", "color-picker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
# GUI 依赖保持可选：纯逻辑层（geometry/config/naming/colors/ocr.base/updater）
# 零依赖；capture/stitch 的拼接算法仅依赖 numpy（OCR 链路同样需要），
# CI 可在无显示环境下直接跑全部单元测试。
dependencies = ["numpy>=1.26,<3", "openpyxl>=3.1.5,<4"]

[project.optional-dependencies]
gui = [
    "PySide6>=6.8,<7",
    "pynput>=1.7,<2",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]
ocr = [
    "rapidocr-onnxruntime==1.4.4",
    "onnxruntime==1.23.2",         # verified runtime; newer releases require revalidation
    "opencv-python-headless>=4.8",  # OCR runs in its own process, separate from Qt
    "PyYAML>=6.0",                  # rapidocr 的隐式依赖（--no-deps 分批安装时发现）
]
offline = [
    "ctranslate2==4.6.0",
    "sentencepiece==0.2.1",
    "setuptools==80.9.0; sys_platform == 'win32'", # CTranslate2 4.6 Windows DLL loader uses pkg_resources.
]
translate = [
    "argostranslate>=1.9,<2",       # 离线神经翻译（CTranslate2 + SentencePiece）
    "ctranslate2>=4.0",
    "sentencepiece>=0.2",
    "stanza>=1.8",                  # argos 的句子边界切分
]
dev = [
    "pytest>=8.2,<9",
]
record = ["av==16.1.0", "SoundCard==0.4.5", "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'"]
all = [
    "PySide6>=6.8,<7",
    "av==16.1.0",
    "SoundCard==0.4.5",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pynput>=1.7,<2",
    "rapidocr-onnxruntime==1.4.4",
    "onnxruntime==1.23.2",         # verified runtime; newer releases require revalidation
    "opencv-python-headless>=4.8",
    "PyYAML>=6.0",
    "argostranslate>=1.9,<2",
    "ctranslate2>=4.0",
    "sentencepiece>=0.2",
    "stanza>=1.8",
]

[project.scripts]
sgc = "shiguang_capture.__main__:main"

[project.urls]
Homepage = "https://github.com/asoming/shiguang-capture"
Repository = "https://github.com/asoming/shiguang-capture"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
"shiguang_capture" = ["assets/*.ttf", "translation_data/**/*", "translation_data/manifest.json"]
"shiguang_capture.ocr" = ["models.json", "data/*.onnx", "data/*.txt"]
