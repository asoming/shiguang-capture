[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiguang-capture"
version = "1.0.0"
description = "拾光 Capture — 屏幕信息捕获与再利用工具（截/钉/取/录 + 本地 OCR）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "asoming" }]
keywords = ["screenshot", "ocr", "screen-capture", "pin", "color-picker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
# GUI 依赖保持可选：纯逻辑层（geometry/config/naming/colors/ocr.base）零依赖，
# CI 可在无显示环境下直接跑全部单元测试。
dependencies = []

[project.optional-dependencies]
gui = [
    "PySide6>=6.7,<7",
    "pynput>=1.7,<2",
]
ocr = [
    "rapidocr-onnxruntime>=1.3,<2",
]
dev = [
    "pytest>=8.2,<9",
]
all = [
    "PySide6>=6.7,<7",
    "pynput>=1.7,<2",
    "rapidocr-onnxruntime>=1.3,<2",
]

[project.scripts]
sgc = "shiguang_capture.__main__:main"

[project.urls]
Homepage = "https://github.com/asoming/shiguang-capture"
Repository = "https://github.com/asoming/shiguang-capture"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
